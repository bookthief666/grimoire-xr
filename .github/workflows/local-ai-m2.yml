name: Trusted M2 local AI QA

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Trusted branch or commit to test'
        required: true
        default: 'agent/fold6-ai-qa-resume'
  push:
    branches:
      - 'automation/local-ai'
    paths:
      - '.automation/target-ref'
      - '.automation/kick'

permissions:
  contents: read

concurrency:
  group: trusted-m2-local-ai
  cancel-in-progress: false

jobs:
  local-ai:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, ARM64, grimoire-m2]
    timeout-minutes: 90
    env:
      TEXT_PROVIDER: ollama
      IMAGE_PROVIDER: comfyui
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3:8b
      COMFYUI_BASE_URL: http://127.0.0.1:8188
      COMFYUI_CHECKPOINT: juggernautXL_ragnarokBy.safetensors
      PORT: '8788'
      GRIMOIRE_QA_API_URL: http://127.0.0.1:8788
      GRIMOIRE_QA_TIMEOUT_MS: '1800000'
    steps:
      - name: Checkout automation controller
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve trusted target ref
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_REF='${{ inputs.target_ref }}'
          else
            TARGET_REF="$(tr -d '\r\n' < .automation/target-ref)"
          fi
          if [[ -z "$TARGET_REF" || "$TARGET_REF" == *$'\n'* ]]; then
            echo 'Invalid target ref.' >&2
            exit 1
          fi
          echo "ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "Testing trusted ref: $TARGET_REF"

      - name: Checkout target without destroying QA checkpoints
        shell: bash
        run: |
          git reset --hard
          git clean -fd -e qa-output/ -e automation-logs/
          git fetch --no-tags --depth=1 origin "${{ steps.target.outputs.ref }}"
          git checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Unit tests and production build
        run: npm run check

      - name: Verify local model services
        shell: bash
        run: |
          curl --fail --silent --show-error "$OLLAMA_BASE_URL/api/tags" >/dev/null
          curl --fail --silent --show-error "$COMFYUI_BASE_URL/system_stats" >/dev/null

      - name: Start isolated branch API
        shell: bash
        run: |
          mkdir -p automation-logs
          node server/index.mjs > automation-logs/api.log 2>&1 &
          echo $! > automation-logs/api.pid
          for attempt in {1..60}; do
            if curl --fail --silent "$GRIMOIRE_QA_API_URL/health" > automation-logs/health.json; then
              exit 0
            fi
            sleep 2
          done
          echo 'Branch API did not become healthy.' >&2
          cat automation-logs/api.log >&2 || true
          exit 1

      - name: Local AI contract QA
        run: npm run qa:ai:contracts

      - name: Preview Final Refine QA with checkpoint resume
        shell: bash
        run: |
          MODE=$(node --input-type=module -e "import { findLatestIncompleteRun } from './scripts/qaRunState.mjs'; const run = await findLatestIncompleteRun('qa-output'); process.stdout.write(run ? 'resume' : 'fresh');")
          if [[ "$MODE" == 'resume' ]]; then
            echo 'Incomplete QA checkpoint found; resuming deliberately.'
            npm run qa:ai:resume
          else
            npm run qa:ai
          fi

      - name: Stop isolated API
        if: always()
        shell: bash
        run: |
          if [[ -f automation-logs/api.pid ]]; then
            kill "$(cat automation-logs/api.pid)" 2>/dev/null || true
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grimoire-local-ai-${{ github.run_id }}
          path: |
            qa-output/
            automation-logs/
          if-no-files-found: warn
          retention-days: 14
