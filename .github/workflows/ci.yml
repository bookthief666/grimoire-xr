name: Grimoire XR CI

on:
  push:
    branches:
      - main
      - claude/temple-foundation-hub
      - agent/foundation-hardening
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    name: Test + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Deterministic tests and production build
        run: npm run check

  lint-audit:
    name: Legacy lint audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Report lint debt
        run: npm run lint
