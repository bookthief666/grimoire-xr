name: Grimoire XR CI

on:
  push:
    branches:
      - main
      - claude/temple-foundation-hub
      - agent/foundation-hardening
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test, build, and lint
        run: npm run check
