name: Hosted verification

on:
  pull_request:
  push:
    branches:
      - 'agent/**'
      - 'checkpoint/**'

permissions:
  contents: read

concurrency:
  group: hosted-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Unit tests and production build
        run: npm run check
