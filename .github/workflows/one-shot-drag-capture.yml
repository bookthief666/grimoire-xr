name: One-shot drag capture hardening

on:
  push:
    branches:
      - agent/react-xr-hardening-v2

permissions:
  contents: write

jobs:
  patch-drag-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: agent/react-xr-hardening-v2

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Route drag capture through safe helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          workbench = Path('src/scene/workbench/WorkbenchCards.tsx')
          text = workbench.read_text()
          text = text.replace(
              "import { pressable } from '../pressable'",
              "import { capturePointerSafely, pressable, releasePointerSafely } from '../pressable'",
              1,
          )
          old_down = """        const target = event.target as unknown as {
                  setPointerCapture?: (pointerId: number) => void
                }
                const startPoint = event.point.clone()
                pointerDownPointRef.current = startPoint
                target.setPointerCapture?.(event.pointerId)
                onDragStart(startPoint)"""
          new_down = """        const startPoint = event.point.clone()
                pointerDownPointRef.current = startPoint
                capturePointerSafely(event.target, event.pointerId)
                onDragStart(startPoint)"""
          if old_down not in text:
              raise SystemExit('Workbench pointer-down block not found')
          text = text.replace(old_down, new_down, 1)

          old_up = """        const target = event.target as unknown as {
                  releasePointerCapture?: (pointerId: number) => void
                }
                target.releasePointerCapture?.(event.pointerId)
                const moved = pointerDownPointRef.current"""
          new_up = """        releasePointerSafely(event.target, event.pointerId)
                const moved = pointerDownPointRef.current"""
          if old_up not in text:
              raise SystemExit('Workbench pointer-up block not found')
          text = text.replace(old_up, new_up, 1)

          old_cancel = """      onPointerCancel={(event) => {
                event.stopPropagation()
                pointerDownPointRef.current = null
                onDragEnd()
              }}"""
          new_cancel = """      onPointerCancel={(event) => {
                event.stopPropagation()
                releasePointerSafely(event.target, event.pointerId)
                pointerDownPointRef.current = null
                onDragEnd()
              }}"""
          if old_cancel not in text:
              raise SystemExit('Workbench pointer-cancel block not found')
          workbench.write_text(text.replace(old_cancel, new_cancel, 1))

          panels = Path('src/scene/InWorldOraclePanels.tsx')
          text = panels.read_text()
          text = text.replace(
              "import { TempleText } from './TempleText'",
              "import { TempleText } from './TempleText'\nimport { capturePointerSafely, releasePointerSafely } from './pressable'",
              1,
          )
          old_down = """        const target = event.target as unknown as {
                  setPointerCapture?: (pointerId: number) => void
                }

                target.setPointerCapture?.(event.pointerId)
                onDragStart(event.point.clone())"""
          new_down = """        capturePointerSafely(event.target, event.pointerId)
                onDragStart(event.point.clone())"""
          if old_down not in text:
              raise SystemExit('Panel pointer-down block not found')
          text = text.replace(old_down, new_down, 1)

          old_up = """        const target = event.target as unknown as {
                  releasePointerCapture?: (pointerId: number) => void
                }

                target.releasePointerCapture?.(event.pointerId)
                onDragEnd()
              }}"""
          new_up = """        releasePointerSafely(event.target, event.pointerId)
                onDragEnd()
              }}
              onPointerCancel={(event) => {
                event.stopPropagation()
                releasePointerSafely(event.target, event.pointerId)
                onDragEnd()
              }}"""
          if old_up not in text:
              raise SystemExit('Panel pointer-up block not found')
          panels.write_text(text.replace(old_up, new_up, 1))
          PY

      - name: Refuse unrelated source changes
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/scene/InWorldOraclePanels.tsx src/scene/workbench/WorkbenchCards.tsx | sort)"
          test "$changed" = "$expected" || {
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Qualify patch
        run: |
          npm test
          npm run build
          npm run lint

      - name: Commit qualified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene/InWorldOraclePanels.tsx src/scene/workbench/WorkbenchCards.tsx
          git commit -m "fix: harden drag pointer capture lifecycle"
          git push origin HEAD:agent/react-xr-hardening-v2
