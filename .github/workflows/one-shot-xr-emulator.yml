name: One-shot explicit XR emulator patch

on:
  push:
    branches:
      - agent/react-xr-hardening-v2

permissions:
  contents: write

jobs:
  patch-xr-store:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: agent/react-xr-hardening-v2

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Make XR emulation opt-in
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = "const xrStore = createXRStore()\n\nfunction flatPanelDebugEnabled()"
          new = """function xrEmulationEnabled() {
            if (typeof window === 'undefined') return false
            return new URLSearchParams(window.location.search).get('emulate') === '1'
          }

          const xrStore = createXRStore({
            emulate: xrEmulationEnabled() ? 'metaQuest3' : false,
          })

          function flatPanelDebugEnabled()"""

          if old not in text:
              raise SystemExit('Expected xrStore declaration not found; refusing broad rewrite.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Refuse unrelated source changes
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "src/App.tsx" || {
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Qualify patch
        run: |
          npm test
          npm run build
          npm run lint

      - name: Commit qualified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: make XR emulation explicit"
          git push origin HEAD:agent/react-xr-hardening-v2
