name: One-shot safe dependency refresh

on:
  push:
    branches:
      - agent/react-xr-hardening-v2

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: agent/react-xr-hardening-v2

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact current lockfile
        run: npm ci

      - name: Refresh only lockfile-resolvable advisories
        run: npm audit fix --package-lock-only

      - name: Refuse package manifest changes
        run: git diff --exit-code -- package.json

      - name: Require production high advisories to clear
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile refresh when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh vulnerable transitive dependencies"
          git push origin HEAD:agent/react-xr-hardening-v2
